<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#04060a"/>

  <!-- browser window -->
  <rect x="300" y="130" width="1000" height="640" rx="14" fill="#0e131c" stroke="#263041" stroke-width="2"/>
  <line x1="300" y1="200" x2="1300" y2="200" stroke="#263041" stroke-width="2"/>

  <!-- traffic dots -->
  <circle cx="340" cy="165" r="7" fill="#39424f"/>
  <circle cx="368" cy="165" r="7" fill="#39424f"/>
  <circle cx="396" cy="165" r="7" fill="#39424f"/>

  <!-- address bar -->
  <rect x="450" y="148" width="600" height="30" rx="15" fill="#04060a" stroke="#263041" stroke-width="1.5"/>
  <circle cx="474" cy="163" r="5" fill="#3b82f6"/>
  <rect x="492" y="158" width="220" height="10" rx="5" fill="#263041"/>

  <!-- nav line -->
  <rect x="340" y="234" width="920" height="12" rx="6" fill="#263041"/>

  <!-- hero block -->
  <rect x="340" y="272" width="920" height="220" rx="8" fill="#122036" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="376" y="322" width="260" height="20" rx="5" fill="#e5e7eb"/>
  <rect x="376" y="356" width="340" height="11" rx="5.5" fill="#39424f"/>
  <rect x="376" y="380" width="140" height="34" rx="17" fill="#3b82f6"/>

  <!-- two content blocks -->
  <rect x="340" y="520" width="440" height="220" rx="8" fill="#0e131c" stroke="#263041" stroke-width="1.5"/>
  <rect x="820" y="520" width="440" height="220" rx="8" fill="#0e131c" stroke="#263041" stroke-width="1.5"/>
  <rect x="372" y="552" width="180" height="14" rx="4" fill="#39424f"/>
  <rect x="852" y="552" width="180" height="14" rx="4" fill="#39424f"/>
  <rect x="372" y="580" width="376" height="9" rx="4.5" fill="#263041"/>
  <rect x="372" y="600" width="340" height="9" rx="4.5" fill="#263041"/>
  <rect x="852" y="580" width="376" height="9" rx="4.5" fill="#263041"/>
  <rect x="852" y="600" width="340" height="9" rx="4.5" fill="#263041"/>
</svg>
